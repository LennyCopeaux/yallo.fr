;\n}\n.slide-title .accent { color: hsl(var(--primary)); }\n.slide-sub {\n  font-size: 20px;\n  line-height: 1.5;\n  color: hsl(var(--muted-foreground));\n  margin-top: 18px;\n  max-width: 1200px;\n}\n\n/* ──────────────────────────────────────────────────────────────────\n   Cards & containers\n   ────────────────────────────────────────────────────────────────── */\n.card {\n  background: hsl(var(--card));\n  border: 1px solid hsl(var(--border));\n  border-radius: 16px;\n  padding: 28px;\n  position: relative;\n}\n.card.noise::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E\");\n  opacity: 0.025;\n  pointer-events: none;\n  border-radius: inherit;\n}\n\n.tile {\n  background: hsl(var(--card));\n  border: 1px solid hsl(var(--border));\n  border-radius: 14px;\n  padding: 22px 24px;\n}\n\n.kicker {\n  font-size: 12px;\n  color: hsl(var(--muted-foreground));\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  font-weight: 600;\n}\n\n.pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding: 6px 14px;\n  border-radius: 999px;\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.02em;\n  background: hsl(var(--muted));\n  color: hsl(var(--foreground));\n  border: 1px solid hsl(var(--border));\n}\n.pill.amber { background: hsl(var(--primary) / 0.12); color: hsl(var(--primary)); border-color: hsl(var(--primary) / 0.25); }\n.pill.success { background: hsl(var(--success) / 0.12); color: hsl(var(--success)); border-color: hsl(var(--success) / 0.25); }\n.pill.warning { background: hsl(var(--warning) / 0.14); color: hsl(var(--warning)); border-color: hsl(var(--warning) / 0.3); }\n.pill.danger  { background: hsl(var(--danger) / 0.14);  color: hsl(var(--danger));  border-color: hsl(var(--danger) / 0.3); }\n.pill.info    { background: hsl(var(--info) / 0.14);    color: hsl(var(--info));    border-color: hsl(var(--info) / 0.3); }\n\n/* ──────────────────────────────────────────────────────────────────\n   Tables\n   ────────────────────────────────────────────────────────────────── */\n.tbl {\n  width: 100%;\n  border-collapse: separate;\n  border-spacing: 0;\n  font-size: 16px;\n  color: hsl(var(--foreground));\n  background: hsl(var(--card));\n  border: 1px solid hsl(var(--border));\n  border-radius: 14px;\n  overflow: hidden;\n}\n.tbl thead th {\n  background: hsl(var(--muted));\n  text-align: left;\n  font-weight: 700;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  font-size: 12px;\n  color: hsl(var(--muted-foreground));\n  padding: 14px 18px;\n  border-bottom: 1px solid hsl(var(--border));\n}\n.tbl tbody td {\n  padding: 14px 18px;\n  border-bottom: 1px solid hsl(var(--border));\n  vertical-align: top;\n  line-height: 1.45;\n}\n.tbl tbody tr:nth-child(even) td { background: hsl(var(--muted) / 0.55); }\n.tbl tbody tr:last-child td { border-bottom: 0; }\n.tbl td strong, .tbl td b { color: hsl(var(--foreground)); font-weight: 700; }\n.tbl .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }\n.tbl .center { text-align: center; }\n\n.tbl.compact { font-size: 14px; }\n.tbl.compact thead th { padding: 10px 14px; }\n.tbl.compact tbody td { padding: 10px 14px; }\n\n/* ──────────────────────────────────────────────────────────────────\n   Generic helpers\n   ────────────────────────────────────────────────────────────────── */\n.grid { display: grid; gap: 24px; }\n.col-2 { grid-template-columns: 1fr 1fr; }\n.col-3 { grid-template-columns: repeat(3, 1fr); }\n.col-4 { grid-template-columns: repeat(4, 1fr); }\n.row { display: flex; gap: 24px; }\n.flex { display: flex; }\n.muted { color: hsl(var(--muted-foreground)); }\n.amber { color: hsl(var(--primary)); }\n.mono { font-family: var(--font-mono); }\n.center { text-align: center; }\n\n.divider {\n  height: 1px;\n  background: hsl(var(--border));\n  margin: 24px 0;\n}\n\n.dot {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  display: inline-block;\n}\n.dot.amber { background: hsl(var(--primary)); box-shadow: 0 0 12px hsl(var(--primary) / 0.6); }\n.dot.success { background: hsl(var(--success)); }\n.dot.warning { background: hsl(var(--warning)); }\n.dot.danger { background: hsl(var(--danger)); }\n.dot.info { background: hsl(var(--info)); }\n\n/* ──────────────────────────────────────────────────────────────────\n   Hero / title slide\n   ────────────────────────────────────────────────────────────────── */\n.hero {\n  flex: 1;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  gap: 32px;\n}\n.hero .wordmark {\n  font-size: 260px;\n  font-weight: 700;\n  line-height: 0.9;\n  letter-spacing: -0.05em;\n  background: linear-gradient(135deg, hsl(240 10% 6%) 0%, hsl(var(--primary)) 100%);\n  -webkit-background-clip: text;\n  background-clip: text;\n  -webkit-text-fill-color: transparent;\n  color: transparent;\n}\n.hero .tagline {\n  font-size: 36px;\n  font-weight: 400;\n  color: hsl(var(--foreground));\n  max-width: 1200px;\n  line-height: 1.25;\n}\n.hero .tagline .accent { color: hsl(var(--primary)); font-weight: 700; }\n.hero .meta-strip {\n  margin-top: 24px;\n  display: flex;\n  gap: 64px;\n  align-items: flex-end;\n  flex-wrap: wrap;\n}\n.hero .meta-strip .item .k {\n  font-size: 14px;\n  color: hsl(var(--muted-foreground));\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  margin-bottom: 8px;\n  font-weight: 600;\n}\n.hero .meta-strip .item .v {\n  font-size: 24px;\n  font-weight: 700;\n  color: hsl(var(--foreground));\n  letter-spacing: -0.01em;\n}\n\n.hero-bg-glow {\n  position: absolute;\n  width: 900px; height: 900px;\n  right: -200px; top: -200px;\n  background: radial-gradient(circle, hsl(var(--primary) / 0.22), transparent : hsl(var(--muted-foreground));\n  font-weight: 600;\n}\n.matrix .axis-y { writing-mode: vertical-rl; transform: rotate(180deg); }\n.matrix .cell {\n  border-radius: 12px;\n  padding: 16px;\n  border: 1px solid;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  font-size: 13px;\n}\n.matrix .cell .lvl {\n  font-size: 10px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  font-weight: 700;\n  opacity: 0.7;\n}\n.matrix .risk {\n  background: hsl(var(--card));\n  border: 1px solid currentColor;\n  border-radius: 8px;\n  padding: 6px 10px;\n  font-size: 12px;\n  font-weight: 600;\n  white-space: nowrap;\n}\n.matrix .cell.green { background: hsl(var(--success) / 0.06); border-color: hsl(var(--success) / 0.3); color: hsl(var(--success)); }\n.matrix .cell.yellow { background: hsl(45 89% 55% / 0.06); border-color: hsl(45 89% 55% / 0.3); color: hsl(45 89% 55%); }\n.matrix .cell.orange { background: hsl(var(--warning) / 0.06); border-color: hsl(var(--warning) / 0.3); color: hsl(var(--warning)); }\n.matrix .cell.red { background: hsl(var(--danger) / 0.08); border-color: hsl(var(--danger) / 0.4); color: hsl(var(--danger)); }\n\n/* ──────────────────────────────────────────────────────────────────\n   Architecture diagram\n   ────────────────────────────────────────────────────────────────── */\n.arch-layer {\n  border: 1px solid hsl(var(--border));\n  background: hsl(var(--card));\n  border-radius: 16px;\n  padding: 18px 24px;\n  display: flex;\n  align-items: center;\n  gap: 20px;\n}\n.arch-layer .layer-label {\n  font-size: 11px;\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n  color: hsl(var(--primary));\n  font-weight: 700;\n  min-width: 140px;\n}\n.arch-layer .nodes {\n  display: flex;\n  flex: 1;\n  gap: 12px;\n  flex-wrap: wrap;\n}\n.arch-node {\n  background: hsl(var(--muted) / 0.5);\n  border: 1px solid hsl(var(--border));\n  border-radius: 8px;\n  padding: 10px 16px;\n  font-size: 14px;\n  font-weight: 600;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n.arch-node.primary {\n  background: hsl(var(--primary) / 0.12);\n  border-color: hsl(var(--primary) / 0.35);\n  color: hsl(var(--primary));\n}\n.arch-arrow {\n  display: flex;\n  justify-content: center;\n  color: hsl(var(--muted-foreground));\n  font-size: 22px;\n  line-height: 1;\n}\n\n/* ──────────────────────────────────────────────────────────────────\n   Quote\n   ────────────────────────────────────────────────────────────────── */\n.bigquote {\n  font-size: 42px;\n  font-weight: 400;\n  line-height: 1.25;\n  color: hsl(var(--foreground));\n  letter-spacing: -0.01em;\n  font-style: italic;\n  padding: 24px 0 24px 40px;\n  border-left: 4px solid hsl(var(--primary));\n  max-width: 1300px;\n}\n.bigquote .accent { color: hsl(var(--primary)); font-weight: 700; font-style: normal; }\n.bigquote .mark {\n  display: block;\n  font-size: 80px;\n  color: hsl(var(--primary));\n  line-height: 0.4;\n  margin-bottom: 12px;\n}\n\n/* ──────────────────────────────────────────────────────────────────\n   Stat tiles\n   ────────────────────────────────────────────────────────────────── */\n.stat {\n  background: hsl(var(--card));\n  border: 1px solid hsl(var(--border));\n  border-radius: 14px;\n  padding: 22px 26px;\n  flex: 1;\n}\n.stat .num {\n  font-size: 48px;\n  font-weight: 700;\n  letter-spacing: -0.03em;\n  color: hsl(var(--primary));\n  line-height: 1;\n  font-family: var(--font-sans);\n}\n.stat .lbl {\n  font-size: 13px;\n  color: hsl(var(--muted-foreground));\n  margin-top: 10px;\n  letter-spacing: 0.04em;\n}\n\n/* ──────────────────────────────────────────────────────────────────\n   Tree (CDC functional tree)\n   ────────────────────────────────────────────────────────────────── */\n.tree {\n  font-family: var(--font-mono);\n  font-size: 14px;\n  line-height: 1.75;\n  background: hsl(var(--card));\n  border: 1px solid hsl(var(--border));\n  border-radius: 14px;\n  padding: 22px 28px;\n  color: hsl(var(--foreground));\n  white-space: pre;\n  overflow: hidden;\n}\n.tree .root { color: hsl(var(--primary)); font-weight: 700; letter-spacing: 0.05em; }\n.tree .module { color: hsl(var(--foreground)); font-weight: 700; }\n.tree .p0 { color: hsl(var(--success)); font-weight: 600; }\n.tree .p1 { color: hsl(var(--warning)); font-weight: 600; }\n.tree .p2 { color: hsl(var(--muted-foreground)); }\n\n/* ──────────────────────────────────────────────────────────────────\n   Conclusion big cards\n   ────────────────────────────────────────────────────────────────── */\n.bigcard {\n  background: hsl(var(--card));\n  border: 1px solid hsl(var(--border));\n  border-radius: 18px;\n  padding: 32px;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  flex: 1;\n  position: relative;\n  overflow: hidden;\n}\n.bigcard .idx {\n  font-family: var(--font-mono);\n  font-size: 56px;\n  font-weight: 700;\n  color: hsl(var(--primary) / 0.25);\n  line-height: 0.9;\n  letter-spacing: -0.04em;\n}\n.bigcard h3 {\n  font-size: 22px;\n  margin: 0;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  color: hsl(var(--primary));\n}\n.bigcard p {\n  font-size: 18px;\n  color: hsl(var(--foreground));\n  line-height: 1.5;\n}\n\n/* ──────────────────────────────────────────────────────────────────\n   Misc\n   ────────────────────────────────────────────────────────────────── */\n.callout {\n  background: hsl(var(--primary) / 0.08);\n  border: 1px solid hsl(var(--primary) / 0.3);\n  border-radius: 14px;\n  padding: 22px 28px;\n  font-size: 20px;\n  font-weight: 600;\n  color: hsl(var(--foreground));\n  display: flex;\n  align-items: center;\n  gap: 18px;\n}\n.callout .icon {\n  width: 44px; height: 44px;\n  border-radius: 12px;\n  background: hsl(var(--primary) / 0.15);\n  display: flex; align-items: center; justify-content: center;\n  color: hsl(var(--primary));\n  flex-shrink: 0;\n}\n\nul.bullets { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }\nul.bullets li { display: flex; gap: 12px; align-items: flex-start; font-size: 16px; line-height: 1.5; color: hsl(var(--foreground)); }\nul.bullets li::before {\n  content: \"\"; width: 6px; height: 6px; border-radius: 50%;\n  background: hsl(var(--primary)); flex-shrink: 0; margin-top: 9px;\n}\n\n.section-block { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 16px; padding: 26px 28px; }\n.section-block h4 { font-size: 16px; margin: 0 0 14px 0; color: hsl(var(--primary)); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }\n\n/* Verdict banner */\n.verdict {\n  background: linear-gradient(135deg, hsl(var(--success) / 0.10), hsl(var(--primary) / 0.06));\n  border: 1px solid hsl(var(--success) / 0.35);\n  border-radius: 16px;\n  padding: 24px 32px;\n  font-size: 22px;\n  font-weight: 600;\n  color: hsl(var(--foreground));\n  display: flex;\n  align-items: center;\n  gap: 18px;\n}\n.verdict .check {\n  font-size: 28px;\n  color: hsl(var(--success));\n}\n\n/* Process pipeline (veille) */\n.pipeline {\n  display: flex;\n  align-items: stretch;\n  gap: 14px;\n}\n.pipeline .step {\n  flex: 1;\n  background: hsl(var(--card));\n  border: 1px solid hsl(var(--border));\n  border-radius: 12px;\n  padding: 18px 20px;\n  text-align: center;\n  font-size: 15px;\n  font-weight: 600;\n  position: relative;\n}\n.pipeline .step .n {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  color: hsl(var(--primary));\n  letter-spacing: 0.16em;\n  display: block;\n  margin-bottom: 6px;\n}\n.pipeline .arrow {\n  display: flex;\n  align-items: center;\n  color: hsl(var(--primary));\n  font-size: 20px;\n}\n\n/* Pie chart (CSS conic) */\n.pie {\n  width: 220px; height: 220px;\n  border-radius: 50%;\n  background: conic-gradient(\n    hsl(var(--primary)) 0 81%,\n    hsl(var(--warning)) 81% 97%,\n    hsl(var(--info)) 97% 100%\n  );\n  position: relative;\n  flex-shrink: 0;\n}\n.pie::after {\n  content: \"\";\n  position: absolute;\n  inset: 28%;\n  background: hsl(var(--background));\n  border-radius: 50%;\n}\n.pie-legend { display: flex; flex-direction: column; gap: 12px; font-size: 14px; }\n.pie-legend .row { display: flex; align-items: center; gap: 12px; }\n.pie-legend .sw { width: 14px; height: 14px; border-radius: 4px; }\n\n/* Sequence diagram (vocal flow) */\n.sequence {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  font-family: var(--font-mono);\n  font-size: 14px;\n}\n.seq-step {\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  padding: 14px 18px;\n  background: hsl(var(--card));\n  border: 1px solid hsl(var(--border));\n  border-radius: 10px;\n}\n.seq-step .num {\n  width: 28px; height: 28px;\n  border-radius: 50%;\n  background: hsl(var(--primary));\n  color: hsl(var(--primary-foreground));\n  font-weight: 700;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 13px;\n  flex-shrink: 0;\n}\n.seq-step .actor {\n  color: hsl(var(--primary));\n  font-weight: 700;\n  min-width: 180px;\n  font-size: 13px;\n  text-transform: uppercase;\n  letter-spacing: 0.1em;\n}\n.seq-step .action {\n  color: hsl(var(--foreground));\n  font-size: 14.5px;\n  font-family: var(--font-sans);\n}\n.seq-arrow { color: hsl(var(--primary)); margin-left: 70px; font-size: 14px; }\n\n/* Roadmap */\n.roadmap {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 16px;\n}\n.roadmap .phase {\n  background: hsl(var(--card));\n  border: 1px solid hsl(var(--border));\n  border-radius: 14px;\n  padding: 20px;\n  position: relative;\n}\n.roadmap .phase .ph-label {\n  font-family: var(--font-mono);\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  color: hsl(var(--primary));\n  text-transform: uppercase;\n}\n.roadmap .phase .ph-name {\n  font-size: 22px;\n  font-weight: 700;\n  margin: 4px 0 8px 0;\n}\n.roadmap .phase .ph-when {\n  font-size: 13px;\n  color: hsl(var(--muted-foreground));\n  margin-bottom: 14px;\n  font-family: var(--font-mono);\n}\n.roadmap .phase ul { list-style: none; padding: 0; margin: 0; font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; }\n.roadmap .phase li { color: hsl(var(--foreground)); }\n\n/* small icons (lucide will fill these) */\n[data-lucide] { stroke-width: 1.75; }\n</style>\n  <style>deck-stage:not(:defined){visibility:hidden}</style>\n</head>\n<body>\n\n\n\n<deck-stage width=\"1920\" height=\"1080\">\n\n  <!-- ════════════════════════════════════════════════════════════════\n       SLIDE 1 — TITRE\n       ════════════════════════════════════════════════════════════════ -->\n  <section data-screen-label=\"01 Titre\">\n    <div class=\"hero-bg-glow\"></div>\n    <div class=\"hero\">\n      <div class=\"eyebrow\">Assistant IA vocal pour la restauration rapide</div>\n      <div class=\"wordmark\">Yallo</div>\n      <div class=\"tagline\">\n        <span class=\"accent\">Yallo,</span> l'IA vocale pour la restauration rapide.</div>\n      <div class=\"meta-strip\">\n        <div class=\"item\">\n          <div class=\"k\">Bloc</div>\n          <div class=\"v\">Bloc 1 — Cadrer un projet logiciel</div>\n        </div>\n        <div class=\"item\">\n          <div class=\"k\">Titre</div>\n          <div class=\"v\">RNCP 39583 — Niveau 7</div>\n        </div>\n        <div class=\"item\">\n          <div class=\"k\">Format</div>\n          <div class=\"v\">Oral · 20 min</div>\n        </div>\n        <div class=\"item\">\n          <div class=\"k\">Date</div>\n          <div class=\"v\">Juin 2026</div>\n        </div>\n      </div>\n    </div>\n    <div class=\"slide-footer\">\n      <div class=\"brand\">● Yallo</div>\n      <div class=\"meta\">01 / 23</div>\n    </div>\n  </section>\n\n  <!-- ════════════════════════════════════════════════════════════════\n       SLIDE 2 — PLAN\n       ════════════════════════════════════════════════════════════════ -->\n  <section data-screen-label=\"02 Plan\">\n    <div class=\"slide-head\">\n      <div class=\"eyebrow\">Sommaire</div>\n      <h1 class=\"slide-title\">Plan de la <span class=\"accent\">présentation</span></h1>\n      <p class=\"slide-sub\">Du problème terrain aux décisions techniques et économiques en 23 slides.</p>\n    </div>\n    <div class=\"toc\">\n      <div class=\"toc-item\"><span class=\"n\">01</span><span>Contexte et problématique</span></div>\n      <div class=\"toc-item\"><span class=\"n\">02</span><span>Cartographie des parties prenantes</span></div>\n      <div class=\"toc-item\"><span class=\"n\">03</span><span>Analyse de la demande</span></div>\n      <div class=\"toc-item\"><span class=\"n\">04</span><span>Analyse SWOT</span></div>\n      <div class=\"toc-item\"><span class=\"n\">05</span><span>Audit technique de l'existant</span></div>\n      <div class=\"toc-item\"><span class=\"n\">06</span><span>Cartographie des risques</span></div>\n      <div class=\"toc-item\"><span class=\"n\">07</span><span>Veille technologique</span></div>\n      <div class=\"toc-item\"><span class=\"n\">08</span><span>Étude comparative des solutions</span></div>\n      <div class=\"toc-item\"><span class=\"n\">09</span><span>Cahier des charges fonctionnel</span></div>\n      <div class=\"toc-item\"><span class=\"n\">10</span><span>Estimation de la charge</span></div>\n      <div class=\"toc-item\"><span class=\"n\">11</span><span>Budget prévisionnel</span></div>\n      <div class=\"toc-item\"><span class=\"n\">12</span><span>Architecture logicielle</span></div>\n      <div class=\"toc-item\" style=\"grid-column: 1 / -1;\"><span class=\"n\">13</span><span>Préconisations &amp; conclusion</span></div>\n    </div>\n    <div class=\"slide-footer\">\n      <div class=\"brand\">● Yallo</div>\n      <div class=\"meta\">02 / 23 · Plan</div>\n    </div>\n  </section>\n\n  <!-- ════════════════════════════════════════════════════════════════\n       SLIDE 3 — PARTIES PRENANTES\n       ════════════════════════════════════════════════════════════════ -->\n  <section data-screen-label=\"03 Parties prenantes\">\n    <div class=\"slide-head\">\n yle=\"top:85%; right:10%;\">Supabase · Vercel</div>\n        </div>\n      </div>\n\n      <!-- Stakeholder table -->\n      <div>\n        <table class=\"tbl compact\">\n          <thead>\n            <tr><th>Acteur</th><th>Rôle</th><th class=\"center\">Implication</th></tr>\n          </thead>\n          <tbody>\n            <tr><td><strong>Commanditaire</strong><br><span class=\"muted\" style=\"font-size:12px;\">Restaurateur</span></td><td>Définit les besoins, valide les livrables, financeur</td><td class=\"center\"><span class=\"pill amber\">Fort</span></td></tr>\n            <tr><td><strong>Développeur fullstack</strong></td><td>Conçoit, développe, teste, déploie</td><td class=\"center\"><span class=\"pill amber\">Fort</span></td></tr>\n            <tr><td><strong>PO</strong></td><td>Priorise le besoin, cadre le périmètre MVP et arbitre les fonctionnalités</td><td class=\"center\"><span class=\"pill amber\">Fort</span></td></tr>\n            <tr><td><strong>Designer</strong></td><td>Contribue à l'expérience utilisateur et à la lisibilité des interfaces</td><td class=\"center\"><span class=\"pill\">Faible</span></td></tr>\n            <tr><td><strong>Staff cuisine</strong></td><td>Utilise le dashboard tablette en service</td><td class=\"center\"><span class=\"pill amber\">Fort</span></td></tr>\n            <tr><td><strong>Admin Yallo</strong></td><td>Configure les comptes restaurants &amp; assistants</td><td class=\"center\"><span class=\"pill amber\">Fort</span></td></tr>\n            <tr><td><strong>Client final</strong></td><td>Passe commande par téléphone (agent IA)</td><td class=\"center\"><span class=\"pill\">Moyen</span></td></tr>\n            <tr><td><strong>Partenaires API</strong><br><span class=\"muted\" style=\"font-size:12px;\">Vapi · HubRise · Twilio · Supabase</span></td><td>Fournissent les services tiers managés</td><td class=\"center\"><span class=\"pill\">Faible</span></td></tr>\n          </tbody>\n        </table>\n      </div>\n    </div>\n\
